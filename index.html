<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9B00F">
<title>Copiloto Cocina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">

  <div class="bar">
    <h1>Copiloto Cocina</h1>
    <button class="icon" id="themeBtn" aria-label="Cambiar tema">🌓</button>
  </div>

  <p class="hero" style="font-size:clamp(32px,9vw,52px)">Tus<br>recetas</p>
  <p class="sub">Elige una para empezar a cocinar.</p>

  <ul class="cards" id="cards"></ul>

  <button class="big" id="importBtn">Importar receta (JSON)</button>

  <dialog id="importDialog" style="border:0;border-radius:18px;padding:0;max-width:560px;width:92vw;background:var(--bg);color:var(--ink)">
    <div class="wrap" style="padding:16px">
      <h2 style="margin-top:0">Importar receta</h2>
      <p class="sub" style="margin-bottom:10px">Pega aquí el JSON que te genere Claude con el formato de receta.</p>
      <textarea id="importText" placeholder="{ &quot;id&quot;: &quot;...&quot;, ... }"></textarea>
      <p id="importError" class="tip hidden" style="color:var(--alarm)"></p>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="importCancel" style="flex:1;min-height:52px">Cancelar</button>
        <button class="big" id="importSave" style="flex:1;margin:0">Guardar receta</button>
      </div>
    </div>
  </dialog>

</div>
<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/home.js"></script>
<script src="js/sw-register.js"></script>
</body>
</html>
